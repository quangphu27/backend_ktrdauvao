services:
  - type: web
    name: backend-ktrdauvao
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Nên set trên Dashboard (không commit secret). Fallback hiện tại: file .env trong repo.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: kiemtradauvao
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://kiemtradauvao.vercel.app
